<style>
:root{--paper:#f1efe9;--ink:#1a1a1a;--red:#b3191c;--redfill:#b3191c;--grey:#555;--body:#333;--hair:#a9a69f;--light:#f4f2ec;--chip:#fbfaf6;--pad:clamp(20px,4vw,48px);color-scheme:light}
html[data-theme="dark"]{--paper:#141414;--ink:#e8e5dc;--red:#e5484d;--redfill:#b3191c;--grey:#a3a09a;--body:#cfccc4;--hair:#55534f;--light:#f4f2ec;color-scheme:dark}
html[data-theme="dark"] .only-light,html[data-theme="light"] .only-dark{display:none!important}
/* the seal label keeps its own inks in both modes */
.label{--ink:#1a1a1a;--chip:#fbfaf6;--red:#b3191c;color:#1a1a1a}
.label .film{background-color:#f1efe9}
html[data-theme="dark"] .label{border-color:#f1efe9}
.tog{background:none;border:0;cursor:pointer;min-height:44px;padding:0 4px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);display:inline-flex;align-items:center;gap:6px}
.tog span{padding:2px 4px}
html[data-theme="light"] .tog-l,html[data-theme="dark"] .tog-d{color:var(--ink);border-bottom:2px solid var(--red)}
.hright{display:flex;align-items:center;gap:14px}
.start-tog{position:absolute;top:8px;right:var(--pad)}
.sweep{position:fixed;inset:0;z-index:20;pointer-events:none;animation:sweep 180ms step-end forwards}
@keyframes sweep{0%{clip-path:inset(0 0 0 0)}17%{clip-path:inset(17% 0 0 0)}33%{clip-path:inset(33% 0 0 0)}50%{clip-path:inset(50% 0 0 0)}67%{clip-path:inset(67% 0 0 0)}83%{clip-path:inset(83% 0 0 0)}100%{clip-path:inset(100% 0 0 0)}}
.sweep-line{position:fixed;left:0;right:0;height:3px;z-index:21;pointer-events:none;background-image:radial-gradient(var(--ink) .9px,transparent 1.2px);background-size:3px 3px;animation:scan 180ms step-end forwards}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Literata',Georgia,serif}
a{color:var(--red)}a:hover{color:var(--ink)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
.mono{font-family:'IBM Plex Mono',monospace}
.app{position:relative;height:100vh;height:100dvh;min-height:520px;display:flex;flex-direction:column;overflow:hidden}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px;padding:8px var(--pad);border-bottom:2px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.logo{background:none;border:0;padding:2px 0;min-height:44px;cursor:pointer;display:flex;align-items:center}
.label{display:flex;height:40px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.tab{width:40px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--red)}
.tab svg{width:30px;height:30px}
.film{display:flex;align-items:center;padding:0 7px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);background-image:radial-gradient(var(--ink) .7px,transparent 1px);background-size:3px 3px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 8px;background:var(--chip);border:1px solid var(--ink);border-radius:3px;text-transform:none}
.chip .zh{font-family:'Noto Sans SC',sans-serif;font-weight:500;font-size:9px;line-height:1.15;letter-spacing:.9em;margin-right:-.9em}
.label{flex:none}
.chip .en{white-space:nowrap;font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:11px;line-height:1.1;letter-spacing:.06em}
.crumb{display:flex;align-items:center;gap:8px;padding:4px 6px;color:var(--grey)}
.pinfo{padding:4px 6px;color:var(--grey);min-width:1px}

/* body */
.stage{flex:1;min-height:0;position:relative}
main{position:relative;height:100%;overflow-y:auto;padding:0 var(--pad)}
.page{max-width:640px;margin:0 auto;padding:clamp(28px,5vh,56px) 0 32px;display:flex;flex-direction:column;gap:20px;font-size:19px;line-height:1.6}
.page.home{max-width:680px;padding-top:clamp(32px,6vh,64px);gap:40px}
.page p{margin:0}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0}
h1{margin:0;font-weight:600}
.home h1{font-size:clamp(40px,6vw,64px);line-height:1.02;letter-spacing:-.01em}
.ch h1{font-size:clamp(36px,5vw,52px);line-height:1.05}
.edition{font-size:24px;font-style:italic}
.rule{width:64px;margin:4px 0;border:0;border-top:4px solid var(--red)}
h2{margin:0;font-size:28px;font-weight:600;line-height:1.2}
h2 .sec{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--red)}
.note{padding:12px 16px;border:1.5px dashed var(--ink);font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.5}
.ph{font-family:'IBM Plex Mono',monospace;font-size:.82em;border:1.5px dashed currentColor;padding:0 4px;white-space:nowrap}
.toc{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:16px;border-top:1px solid var(--hair);font-family:'IBM Plex Mono',monospace;font-size:14px}
.toc .t{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.toc b{color:var(--red);font-weight:600}
.callout{border:2px solid var(--ink);display:flex;flex-direction:column}
.callout .hd{padding:8px 22px;background:var(--redfill);color:var(--light);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.callout ol{margin:0;padding:16px 22px 18px 44px;display:flex;flex-direction:column;gap:6px}
figure{margin:4px 0 0;display:flex;flex-direction:column;gap:8px}
.dither{height:220px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background-image:radial-gradient(var(--ink) .9px,transparent 1.2px),radial-gradient(var(--red) 1px,transparent 1.3px);background-size:4px 4px,6px 6px;background-position:0 0,2px 3px}
.dither span{background:var(--paper);padding:6px 10px;border:1.5px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px}
.figs{width:min(740px,calc(100vw - 2*var(--pad)));margin:4px 0 0 50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:20px 24px;justify-content:center;align-items:flex-start}
.figs figure{margin:0;max-width:100%}
.figs img{display:block;max-width:100%;height:auto;border:2px solid var(--ink);padding:10px;background:var(--paper)}
.figcap{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--grey);text-align:center}
.score .fn{margin-right:auto;text-transform:none;letter-spacing:.02em}
figcaption{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--grey)}

/* receipt table */
.receipt{width:100%;border-collapse:collapse;border:2px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.35}
.receipt th,.receipt td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--hair)}
.receipt thead th{border-top:0;border-bottom:2px solid var(--ink);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.receipt tbody th{font-weight:400;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);width:24%}
.receipt td+td,.receipt th+th{border-left:1px solid var(--hair)}
.receipt td.lose{background-color:var(--paper);background-image:radial-gradient(var(--red) 1.1px,transparent 1.5px);background-size:4px 4px}
.receipt td.lose .v{background:var(--paper);padding:1px 4px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.legend{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.legend i{width:16px;height:16px;background-image:radial-gradient(var(--red) 1.1px,transparent 1.5px);background-size:4px 4px;border:1.5px solid var(--ink);display:inline-block}
.score{display:flex;flex-wrap:wrap;row-gap:4px;justify-content:flex-end;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.score b{color:var(--ink)}

/* home */
.sub{font-size:20px;line-height:1.5;color:var(--body);max-width:32em}
nav.tree{display:flex;flex-direction:column;border-top:2px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:15px}
.branch{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;text-align:left;padding:14px 0 18px;min-height:44px;background:none;border:0;border-bottom:1px solid var(--hair);cursor:pointer;width:100%}
.entry .num{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.entry .tt{font-family:'Literata',Georgia,serif;font-size:26px;font-weight:600;line-height:1.2}
.entry .ds{font-family:'Literata',Georgia,serif;font-size:17px;line-height:1.45;color:var(--body)}
.entry .go{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;white-space:nowrap;color:var(--red)}
.unwritten{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px 0;color:var(--grey)}

/* start */
body.start header,body.start #foot{display:none}

.label.big{height:clamp(76px,17vw,128px);border-width:2px;border-radius:8px}
.label.big .tab{width:clamp(76px,17vw,128px)}
.label.big .tab svg{width:72%;height:72%}
.label.big .film{padding:0 clamp(10px,3vw,22px);border-width:2px}

.start .tag{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.start .btn{min-width:180px}
/* footer */
footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px var(--pad);border-top:2px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
footer.homef{flex-wrap:wrap;padding:14px var(--pad);font-size:12px;color:var(--grey)}
.btn{font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:44px;min-width:96px;padding:0 14px;background:transparent;border:2px solid var(--ink);cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--redfill);color:var(--light);font-weight:600}
.prog{flex:1;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.segs{display:flex;gap:4px;width:100%}
.segs span{flex:1;height:6px;border:1.5px solid var(--ink)}
.end{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:16px;border-top:1px solid var(--hair);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.end span{color:var(--grey)}

/* e-ink refresh: partial only, no flash */
@keyframes inkDraw{0%{clip-path:inset(0 -100vw 100% -100vw)}17%{clip-path:inset(0 -100vw 83% -100vw)}33%{clip-path:inset(0 -100vw 66% -100vw)}50%{clip-path:inset(0 -100vw 50% -100vw)}67%{clip-path:inset(0 -100vw 33% -100vw)}83%{clip-path:inset(0 -100vw 17% -100vw)}100%{clip-path:none}}
@keyframes ghostFade{0%{opacity:.16}40%{opacity:.16}41%{opacity:.08}75%{opacity:.08}76%{opacity:0}100%{opacity:0}}
@keyframes scan{0%{top:0}17%{top:17%}33%{top:33%}50%{top:50%}67%{top:67%}83%{top:83%}99%{top:calc(100% - 3px);opacity:1}100%{top:calc(100% - 3px);opacity:0}}
.scan{position:absolute;left:0;right:0;height:3px;z-index:5;pointer-events:none;background-image:radial-gradient(var(--ink) .9px,transparent 1.2px);background-size:3px 3px;animation:scan 180ms step-end forwards}
.ink-draw{animation:inkDraw 180ms step-end both}
.ink-ghost{position:absolute;top:0;left:var(--pad);right:var(--pad);pointer-events:none;animation:ghostFade 450ms step-end forwards}
@media (prefers-reduced-motion:reduce){.ink-draw{animation:none}.ink-ghost,.scan{display:none}}

@media (max-width:600px){
  .label{height:36px}.tab{width:34px}.tab svg{width:26px;height:26px}
  .page{font-size:17px;line-height:1.55}

  .receipt th,.receipt td{padding:8px 7px}
  .receipt tbody th{font-size:10.5px;letter-spacing:.04em;width:22%}
  .btn{min-width:80px;padding:0 10px}
  footer{gap:10px}
  header{display:grid;grid-template-columns:1fr auto;grid-template-areas:"logo tog" "crumb pinfo";gap:2px 12px;align-items:center}
  header .logo{grid-area:logo;justify-self:start}

  .tog span{padding:2px 3px}
  header .crumb{grid-area:crumb;padding-left:0}
  header .hright{display:contents}
  header .pinfo{grid-area:pinfo;text-align:right}
  header .tog{grid-area:tog}
  .score .fn{flex-basis:100%}
}
</style>

<template id="t-p1">
<article class="page">
  <h2><span class="sec">§1 </span>Start with the hardware</h2>
  <p>Most guides say to start Home Assistant on a Raspberry Pi. I did, with a Pi 4. It works. It was also money I could have saved.</p>
  <p>Home Assistant is never the only thing you run. It's just the first. A Pi is sized for the first thing. You need hardware sized for the something else.</p>
  <p>For me, the something else turned out to be Immich, Claude Code, Frigate, Tailscale and AdGuard.</p>
  <div class="callout">
    <span class="hd">If I did it again</span>
    <ol><li>Skip the Pi.</li><li>Buy a used PC.</li></ol>
  </div>
</article>
</template>

<template id="t-p4">
<article class="page">
  <h2><span class="sec">§1.3 </span>Not straight onto the metal</h2>
  <p>I didn't install Home Assistant directly on the Precision. We went the Proxmox route instead.</p>
  <p>Proxmox gets its own chapter.</p>
  <div class="end"><span>End of chapter 01</span><button type="button" class="btn primary" data-home>Back to main</button></div>
</article>
</template>

<script>
(function(){
  var PAGES=['t-p0','t-p1','t-p2','t-p3','t-p4'], N=PAGES.length;
  var main=document.getElementById('main'), foot=document.getElementById('foot'), stage=document.querySelector('.stage');
  var crumb=document.getElementById('crumb'), pinfo=document.getElementById('pinfo');
  var state={screen:'home',page:0}, timer=null;

  function tpl(id){return document.getElementById(id).content.firstElementChild.cloneNode(true);}
  function idOf(s){return s.screen==='start'?'t-start':s.screen==='home'?'t-home':PAGES[s.page];}

  function renderFooter(){
    var f;
    if(state.screen==='start'){foot.replaceChildren();return;}
    if(state.screen==='home'){
      f=document.createElement('footer');f.className='homef ink-draw';
      f.innerHTML='<span>voidswarranty.com</span><span>Opened · Modified · Improved</span>';
    }else{
      f=document.createElement('footer');
      var segs='';for(var i=0;i<N;i++){segs+='<span style="background:'+(i===state.page?'var(--red)':(i<state.page?'var(--ink)':'transparent'))+'"></span>';}
      f.innerHTML='<button type="button" class="btn" data-prev>'+(state.page===0?'← Main':'← Prev')+'</button>'+
        '<div class="prog"><span>'+(state.page+1)+' / '+N+'</span><div class="segs" aria-hidden="true">'+segs+'</div></div>'+
        '<button type="button" class="btn" data-next'+(state.page>=N-1?' disabled':'')+'>Next →</button>';
    }
    var wasHome=foot.firstElementChild&&foot.firstElementChild.classList.contains('homef');
    if(wasHome!==(state.screen==='home')) f.classList.add('ink-draw');
    foot.replaceChildren(f);
  }

  function go(screen,page,first){
    var prev={screen:state.screen,page:state.page};
    if(!first&&prev.screen===screen&&prev.page===page)return;
    state={screen:screen,page:page};
    clearTimeout(timer);
    var nodes=[];
    if(!first){var g=tpl(idOf(prev));g.classList.add('ink-ghost');g.setAttribute('aria-hidden','true');nodes.push(g);}
    var cur=tpl(idOf(state));cur.classList.add('ink-draw');nodes.push(cur);
    main.replaceChildren.apply(main,nodes);main.scrollTop=0;
    timer=setTimeout(function(){var gh=main.querySelector('.ink-ghost');if(gh)gh.remove();},450);
    if(!first){var sc=document.createElement('div');sc.className='scan';sc.setAttribute('aria-hidden','true');stage.appendChild(sc);setTimeout(function(){sc.remove();},220);}
    var wasStart=document.body.classList.contains('start');document.body.classList.toggle('start',screen==='start');
    if(wasStart&&screen!=='start'){var hd=document.querySelector('header');hd.classList.remove('ink-draw');void hd.offsetWidth;hd.classList.add('ink-draw');}
    crumb.textContent=screen==='home'?'main':'main / ch.01';
    pinfo.textContent=screen==='home'?'':'Page '+(page+1)+' of '+N;
    renderFooter();
    try{history.replaceState(null,'',screen==='start'?location.pathname:screen==='home'?'#main':'#ch01-'+(page+1));}catch(e){}
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.id==='logo'||t.hasAttribute('data-home')||t.hasAttribute('data-enter'))go('home',0);
    else if(t.hasAttribute('data-open'))go('ch1',0);
    else if(t.hasAttribute('data-prev'))state.page===0?go('home',0):go('ch1',state.page-1);
    else if(t.hasAttribute('data-next')&&state.page<N-1)go('ch1',state.page+1);
  });
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function syncTheme(){
    var t=document.documentElement.getAttribute('data-theme');
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#141414':'#f1efe9');
    document.querySelectorAll('[data-theme-toggle]').forEach(function(b){b.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');b.setAttribute('aria-pressed',t==='dark'?'true':'false');});
  }
  function setTheme(t){
    var old=getComputedStyle(document.documentElement).getPropertyValue('--paper');
    document.documentElement.setAttribute('data-theme',t);
    try{localStorage.setItem('vw-theme',t);}catch(e){}
    syncTheme();
    if(reduce)return;
    var sw=document.createElement('div');sw.className='sweep';sw.style.background=old;
    var ln=document.createElement('div');ln.className='sweep-line';
    document.body.appendChild(sw);document.body.appendChild(ln);
    setTimeout(function(){sw.remove();ln.remove();},220);
  }
  syncTheme();
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-theme-toggle]');if(!b)return;
    e.stopPropagation();
    setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  },true);
  if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');var onmq=function(ev){var saved;try{saved=localStorage.getItem('vw-theme');}catch(e){}if(!saved){document.documentElement.setAttribute('data-theme',ev.matches?'dark':'light');syncTheme();}};if(mq.addEventListener)mq.addEventListener('change',onmq);}
  document.addEventListener('keydown',function(e){
    if(state.screen!=='ch1')return;
    if(e.key==='ArrowRight'&&state.page<N-1)go('ch1',state.page+1);
    if(e.key==='ArrowLeft')state.page===0?go('home',0):go('ch1',state.page-1);
  });

  var m=/^#ch01-(\d+)$/.exec(location.hash);
  if(m){var p=Math.min(Math.max(parseInt(m[1],10)-1,0),N-1);state={screen:'ch1',page:p};go('ch1',p,true);}
  else if(location.hash==='#main')go('home',0,true);
  else go('start',0,true);
})();
</script>
</body>
</html>
