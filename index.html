<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voids Warranty</title>
<meta name="description" content="A project blog about taking things apart, changing them and putting them back better. Coming later.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 76 76'%3E%3Cpath fill='%23D8CA8E' fill-rule='evenodd' d='M2 38a36 36 0 1 0 72 0a36 36 0 1 0 -72 0ZM32.5 14h11v18.5h18.5v11h-18.5v18.5h-11v-18.5h-18.5v-11h18.5Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one sticker-shaped card, centred on a muted sand field of slanted, repeating VOIDS WARRANTY text, like tamper-evident tape. */
:root {
  --ink: #15171A;
  --paper: #F2F3F1;
  --yellow: #D8CA8E;
  --muted: #A9AFB8;
  --fold: #3A3F47;
  --tape: rgba(21, 23, 26, 0.16);
  --display: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 32px 16px;
  background: var(--yellow);
  color: var(--ink);
  font-family: var(--body);
  overflow-x: hidden;
}
.tape {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
.tape text {
  font-family: var(--display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.08em;
  fill: var(--tape);
}
.sticker-wrap {
  position: relative;
  z-index: 1;
  width: min(640px, 100%);
  filter: drop-shadow(0 20px 28px rgba(21, 23, 26, 0.35));
}
.sticker {
  position: relative;
  padding: 48px 48px 64px;
  background: var(--ink);
  color: var(--paper);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 64px), calc(100% - 64px) 100%, 0 100%);
}
.sticker::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  width: 64px;
  height: 64px;
  background: var(--fold);
  clip-path: polygon(100% 0, 0 100%, 0 0);
}
.brand {
  margin: 0 0 28px;
  font: 700 14px/1 var(--display);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--yellow);
}
h1 {
  margin: 0 0 24px;
  font: 700 clamp(44px, 12vw, 88px)/0.98 var(--display);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.flip {
  display: inline-block;
  font-size: 0.82em;
  vertical-align: 0.15em;
  color: inherit;
  animation: flip 1.4s ease-in-out infinite;
}
@keyframes flip {
  0%, 35% { transform: rotateY(0deg); }
  50%, 85% { transform: rotateY(180deg); }
  100% { transform: rotateY(360deg); }
}
.lede {
  margin: 0;
  max-width: 46ch;
  font-size: 18px;
  line-height: 1.6;
  color: var(--muted);
}
footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  margin-top: 36px;
  padding-top: 20px;
  border-top: 1px solid var(--fold);
  font: 500 12px/1.4 var(--display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.seal { color: var(--yellow); }
.domain { color: var(--muted); }
@media (max-width: 480px) {
  .sticker { padding: 36px 24px 64px; }
  .lede { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .flip { animation: none; }
}
</style>
</head>
<body>
<svg class="tape" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="void-tape" width="230" height="68" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <text x="0" y="25">VOIDS WARRANTY</text>
      <text x="115" y="59">VOIDS WARRANTY</text>
      <text x="-115" y="59">VOIDS WARRANTY</text>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#void-tape)"></rect>
</svg>
<main class="sticker-wrap">
  <div class="sticker">
    <p class="brand">Voids Warranty</p>
    <h1>Coming<br>later<span class="flip" aria-hidden="true">/</span></h1>
    <p class="lede">A project blog about taking things apart, changing them and putting them back better. Electronics, home automation, metalwork, 3D printing and a planted aquarium.</p>
    <footer>
      <span class="seal">Opened · Modified · Improved</span>
      <span class="domain">voidswarranty.com</span>
    </footer>
  </div>
</main>
</body>
</html>
